name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_landmarks:
        description: 'Build resources/geo/landmarks.json from GeoNames and commit it to this branch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux (unit tests, benchmarks, checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies (install scripts stay off, as in ./dev)
        run: PHOTOS_DEV=1 npm ci --ignore-scripts
      - name: Unit and regression tests
        run: npm_config_ignore_scripts=true node --test "test/*.test.js"
      - name: Static checks
        run: |
          if [ -f tools/check-i18n.js ]; then node tools/check-i18n.js; fi
          if [ -f tools/audit-writes.js ]; then node tools/audit-writes.js --check; fi
      - name: Scale benchmark (regression alarm, generous thresholds)
        run: |
          if [ -f tools/bench-scale.js ]; then node tools/bench-scale.js --rows 100000 --check; fi

  macos:
    name: macOS arm64 (setup, tests, smoke)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Cache toolchain and packages
        uses: actions/cache@v4.2.3
        with:
          path: |
            .toolchain
            node_modules
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'dev') }}
      - name: Set up (same command a user runs)
        run: PHOTOS_KEEP_CACHE=1 ./dev setup
      - name: Unit and regression tests with the project's own Node
        run: ./dev node --test "test/*.test.js"
      - name: Smoke test (real app on a generated library)
        run: |
          if [ -f tools/ci-smoke.sh ]; then bash tools/ci-smoke.sh; else echo "no smoke script yet"; fi

  # Manual only. Downloads the GeoNames dumps (CC BY 4.0), runs
  # tools/build-landmarks-dataset.js on a macOS runner (needed for the
  # Traditional-to-Simplified Chinese transform) and commits the dataset.
  landmarks:
    name: Build landmarks dataset (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.build_landmarks
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - run: node tools/build-landmarks-dataset.js
      - run: ls -l resources/geo
      - name: Commit the dataset
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add resources/geo/landmarks.json resources/geo/landmarks.json.sha256
          git commit -m "M13: landmarks dataset built from GeoNames" || echo "nothing to commit"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Original artwork for the Photos clone: three fanned photo cards on a white macOS-style tile
       (824 x 824 shape centred in a 1024 canvas, corner radius 185). Not derived from any Apple asset. -->
  <defs>
    <clipPath id="front"><rect x="-190" y="-215" width="380" height="430" rx="52"/></clipPath>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECEDF2"/></linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FFC14D"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C6B8"/><stop offset="1" stop-color="#3C8DF0"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B66AF2"/><stop offset="1" stop-color="#FF6FA8"/></linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/></filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tile)"/></g>
  <g clip-path="url(#shape)">
    <g transform="translate(512 540)">
      <g transform="rotate(-17)" filter="url(#card)"><rect x="-190" y="-215" width="380" height="430" rx="52" fill="url(#c3)"/></g>
      <g transform="rotate(15)" filter="url(#card)"><rect x="-190" y="-215" width="380" height="430" rx="52" fill="url(#c2)"/></g>
      <g filter="url(#card)">
        <rect x="-190" y="-215" width="380" height="430" rx="52" fill="url(#c1)"/>
        <g clip-path="url(#front)"><circle cx="70" cy="-95" r="48" fill="#FFFFFF" fill-opacity="0.92"/>
        <path d="M-190 215 L-190 60 C-120 -20 -60 20 0 70 C50 25 110 -10 190 90 L190 215 Z" fill="#FFFFFF" fill-opacity="0.9"/>
        <path d="M-190 215 L-190 130 C-100 80 -30 130 40 160 C100 130 150 120 190 150 L190 215 Z" fill="#FFFFFF" fill-opacity="0.55"/></g>
      </g>
    </g>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="2"/>
</svg>
